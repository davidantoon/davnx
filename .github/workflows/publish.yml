name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    # npm trusted publishing names this environment: a token from any other job is refused.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Version and changelog
        id: release
        run: |
          OUTPUT=$(npx nx release --skip-publish --verbose 2>&1) || true
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "No changes were detected"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npx nx run-many -t build

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # Every run: a version already on npm is skipped, so one an earlier run tagged but could not publish goes out.
      - name: Publish to npm
        run: npx nx release publish --verbose

      - name: Push version commits and tags
        if: steps.release.outputs.changed == 'true'
        run: git push --follow-tags
